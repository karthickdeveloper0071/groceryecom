# Provisioned datasources. The uid values are fixed on purpose: the dashboard JSON in
# dashboards/json refers to them by uid ("prometheus", "loki"), so nothing has to be
# re-pointed by hand after a fresh start. Do not rename a uid without editing the
# dashboards.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # Matches global.scrape_interval in ops/prometheus/prometheus.yml
      timeInterval: 15s
      httpMethod: POST

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
