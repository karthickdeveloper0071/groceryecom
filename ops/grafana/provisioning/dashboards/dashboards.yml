# File provider: every *.json under the json/ directory becomes a dashboard.
# Dashboards are read-only in the UI; edit the JSON in Git instead (see ops/README.md).
apiVersion: 1

providers:
  - name: groceryecom
    orgId: 1
    folder: GroceryEcom
    type: file
    disableDeletion: true
    editable: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false
