# Test profile properties.
# Tests run against a real embedded PostgreSQL (see PostgresIntegrationTest), with the
# production Flyway migrations and Hibernate schema validation.

# Use test-specific secret (HS512 needs at least 64 bytes)
jwt.secret=test-secret-for-junit-only-must-be-at-least-sixty-four-bytes-long-for-hs512
jwt.expiration=900000
jwt.refresh-token-expiration=604800000

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

logging.level.root=ERROR
logging.level.com.groceryecom=INFO
logging.file.name=
