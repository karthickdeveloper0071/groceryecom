# Test profile properties - use H2 in-memory for unit tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Use test-specific secret
jwt.secret=test-secret-for-junit-should-be-very-secure-in-prod
jwt.expiration=900000
jwt.refresh-token-expiration=604800000

logging.level.root=ERROR
logging.level.com.GroceryEcom.GorceryEcom=INFO

# Allow bean overriding during tests (helps when multiple security configs define same bean)
spring.main.allow-bean-definition-overriding=true

