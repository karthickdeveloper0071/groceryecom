# Test profile. Tests run against a real embedded PostgreSQL (see PostgresIntegrationTest),
# using the production Flyway migrations and Hibernate schema validation.

spring:
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  # Redis is not needed by tests
  cache:
    type: none

logging:
  level:
    root: WARN
    com.groceryecom: INFO

app:
  security:
    jwt:
      secret: test-secret-for-junit-only-must-be-at-least-sixty-four-bytes-long-for-hs512
    # No Redis in tests: the in-memory stores behave the same way for a single instance
    tokens:
      store: memory
    rate-limit:
      store: memory
      # High enough that the flow tests are never throttled. The limits themselves are
      # covered by RateLimitFilterTest and InMemoryRateLimiterTest with their own values.
      login:
        limit: 1000
        window: 1m
      login-per-account:
        limit: 1000
        window: 1m
      register:
        limit: 1000
        window: 1m
      refresh-token:
        limit: 1000
        window: 1m

  # The expiry job runs on a clock; tests call SubscriptionExpiryService directly with
  # the instant they want, so the scheduler stays out of the way.
  billing:
    expiry-job:
      enabled: false
