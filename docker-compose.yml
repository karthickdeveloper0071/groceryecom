# Infrastructure only:      docker compose up -d
# Infrastructure + the API: docker compose --profile app up -d --build
# The app profile needs JWT_SECRET; copy .env.example to .env first.

services:
  # PostgreSQL with PostGIS (delivery zones need it later)
  postgres:
    image: postgis/postgis:17-3.5
    container_name: grocery_ecom_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-grocery_ecom}
      POSTGRES_USER: ${DB_USERNAME:-grocery}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-grocery}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecom_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-grocery} -d ${DB_NAME:-grocery_ecom}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Cache, carts, rate limits
  redis:
    image: redis:7-alpine
    container_name: grocery_ecom_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecom_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Events between modules and background work
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: grocery_ecom_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ecom_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # The API itself. Started only with: --profile app
  app:
    build: .
    image: groceryecom:local
    container_name: grocery_ecom_api
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # Container-to-container addresses, not localhost
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-grocery_ecom}
      DB_USERNAME: ${DB_USERNAME:-grocery}
      DB_PASSWORD: ${DB_PASSWORD:-grocery}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      # No default on purpose: the API must not start with a shared, well-known secret
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 64 characters)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    networks:
      - ecom_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  ecom_network:
    driver: bridge
